[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "consumer-cad-ai"
version = "0.1.0"
description = "Parametric consumer electronics CAD with verified geometry, exchange files, and MCP tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "build123d==0.10.0",
    "cadquery-ocp==7.8.1.1.post1",
    "ocp_gordon==0.1.18",
    "ezdxf==1.4.4",
    "matplotlib==3.10.8",
    "mcp==1.29.0",
    "pydantic>=2.11,<3",
    "PyJWT[crypto]>=2.12.1,<3",
]

[project.scripts]
consumer-cad = "consumer_cad_ai.cli:main"
consumer-cad-mcp = "consumer_cad_ai.server:main"

[tool.setuptools.packages.find]
where = ["src"]
